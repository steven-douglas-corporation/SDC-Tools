<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SDC · Job Hours Report — Revamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   SDC Job Hours Report — REVAMP styles
   Montserrat (headlines / KPI labels) · Aptos→Inter body
   Improvements: sharper cards, better hierarchy, refined spacing,
   progress bars, group tags, improved table striping
   ============================================================ */

:root{
  --blue:#1574C4; --navy:#061D39; --light:#AACEE8; --yellow:#FFDE51;
  --green:#74C415; --gray:#D9D9D9; --ink:#231F20; --white:#FFFFFF;
  --paper:#F2F5F8;
  --card-bg:#FFFFFF;
  --card-border:#E0E6ED;
  --card-shadow:0 1px 3px rgba(6,29,57,.07), 0 1px 2px rgba(6,29,57,.04);
  --muted:#6B7682;
  --rail:214px; --header:68px;
  --radius:10px;
  --hero-fs:72px;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:'Aptos','Segoe UI',system-ui,sans-serif;
  color:var(--ink); background:#0D1117;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  font-size:13px;
}
.mont{ font-family:'Montserrat',sans-serif; }

/* ---- Canvas -------------------------------------------------------- */
#stage{ position:fixed; inset:0; overflow:hidden; background:#0D1117; }
#canvas{
  width:1280px; height:720px; background:var(--paper);
  position:absolute; left:50%; top:50%; transform-origin:center center;
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 32px 96px rgba(0,0,0,.7);
}
.shell{ position:absolute; inset:0; }

/* ---- Navigation Rail ----------------------------------------------- */
.rail{
  position:absolute; top:0; left:0; bottom:0; width:var(--rail);
  background:var(--navy); z-index:6; display:flex; flex-direction:column;
}
.rail-brand{
  height:var(--header); display:flex; align-items:center;
  padding:0 20px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.rail-brand img{ height:32px; }
.rail-section{
  font-size:9px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:#4A6680; padding:16px 20px 7px;
}
.nav{ display:flex; flex-direction:column; gap:1px; padding:0 10px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border-radius:7px; cursor:pointer; color:#7E9AB5;
  font-size:12.5px; font-weight:600;
  border-left:3px solid transparent;
  transition:background .1s, color .1s;
  user-select:none;
}
.nav-item:hover{ background:rgba(255,255,255,.05); color:#C8DCF0; }
.nav-item.active{
  background:rgba(21,116,196,.2);
  color:#fff;
  border-left:3px solid var(--yellow);
  border-radius:0 7px 7px 0;
}
.nav-item.active .nav-ico{ opacity:1; color:var(--yellow); }
.nav-ico{ width:17px; height:17px; flex:none; opacity:.7; }
.nav-foot{
  margin-top:auto; padding:14px 18px;
  border-top:1px solid rgba(255,255,255,.07);
  color:#4A6680; font-size:10px; line-height:1.6;
}
.nav-foot b{ color:#7E9AB5; font-weight:700; }
.nav-foot .refresh-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--green); margin-right:5px; vertical-align:middle;
}

/* ---- Header -------------------------------------------------------- */
.hdr{
  position:absolute; top:0; left:0; right:0; height:var(--header);
  background:var(--navy);
  display:flex; align-items:center;
  padding:0 24px 0 calc(var(--rail) + 24px); z-index:5;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.hdr-titlewrap{ display:flex; flex-direction:column; gap:3px; }
.hdr-title{
  color:#fff; font-weight:800; letter-spacing:.05em;
  font-size:20px; text-transform:uppercase;
  font-family:'Montserrat',sans-serif; line-height:1;
}
.hdr-sub{
  color:#5E85A8; font-weight:600; font-size:11px;
  letter-spacing:.02em;
}
.hdr-logo{ margin-left:auto; height:38px; display:block; }

/* ---- Content area -------------------------------------------------- */
.content{
  position:absolute; top:var(--header); left:var(--rail); right:0; bottom:0;
  padding:18px 22px 18px; display:flex; flex-direction:column; gap:12px;
}

/* ---- Question strip ------------------------------------------------ */
.qstrip{
  display:flex; align-items:center; gap:10px;
  padding:0 2px;
}
.q-eyebrow{
  font-size:9.5px; font-weight:700; letter-spacing:.15em;
  text-transform:uppercase; color:var(--blue);
  white-space:nowrap;
}
.q-divider{ color:var(--card-border); font-size:12px; }
.q-text{ font-size:12.5px; color:var(--muted); font-weight:600; font-style:italic; }

/* ---- Hero card ----------------------------------------------------- */
.hero{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  border-top:3px solid var(--blue);
  padding:18px 24px;
  display:flex; align-items:center; gap:28px;
  box-shadow:var(--card-shadow);
}
.hero-main{ display:flex; flex-direction:column; }
.hero-label{
  font-size:10px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); margin-bottom:5px;
}
.hero-num{
  font-family:'Montserrat',sans-serif; font-weight:800;
  font-size:var(--hero-fs); line-height:.9;
  color:var(--navy); letter-spacing:-.025em;
}
.hero-sub{ font-size:12px; color:var(--muted); margin-top:8px; font-weight:500; }
.hero-sub b{ color:var(--ink); font-weight:700; }
.hero-divider{
  width:1px; align-self:stretch; background:var(--card-border); margin:0 4px;
}
.hero-aside{ margin-left:auto; }

.delta{
  display:inline-flex; align-items:center; gap:6px; padding:6px 13px;
  border-radius:999px; font-family:'Montserrat',sans-serif; font-weight:800;
  font-size:16px; white-space:nowrap; line-height:1; align-self:center;
}
.delta-arrow{ font-size:15px; line-height:1; }
.delta.over{ background:rgba(255,222,81,.2); color:#8a6d00; }
.delta.good{ background:rgba(116,196,21,.15); color:#3d6906; }
.delta.bad { background:rgba(255,222,81,.2); color:#8a6d00; }

/* ---- KPI Cards ----------------------------------------------------- */
.kpis{ display:grid; gap:12px; }
.kpis.c4{ grid-template-columns:repeat(4,1fr); }
.kpis.c3{ grid-template-columns:repeat(3,1fr); }
.kpis.c2{ grid-template-columns:repeat(2,1fr); }

.kpi{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  padding:13px 15px 12px;
  display:flex; flex-direction:column; gap:5px;
  position:relative; overflow:hidden;
  box-shadow:var(--card-shadow);
}
.kpi-accent{
  position:absolute; top:0; left:0; right:0; height:3px;
  border-radius:var(--radius) var(--radius) 0 0;
}
.kpi-label{
  font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted);
  padding-top:5px;
}
.kpi-val{
  font-family:'Montserrat',sans-serif; font-weight:800;
  font-size:30px; line-height:1; color:var(--navy);
}
.kpi-foot{ font-size:10.5px; color:var(--muted); font-weight:500; }
.kpi.warn .kpi-val{ color:#9a7300; }
.kpi.good .kpi-val{ color:#3d6906; }

/* group tag on util page */
.group-tag{
  display:inline-block; padding:2px 7px; border-radius:4px;
  font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
}
.group-tag.eng { background:rgba(21,116,196,.12); color:#1574C4; }
.group-tag.shop{ background:rgba(6,29,57,.1);  color:#061D39; }
.group-tag.mfg { background:rgba(116,196,21,.12); color:#3d6906; }

/* ---- Panels -------------------------------------------------------- */
.panel{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  padding:13px 16px 11px;
  flex:1; min-height:0; display:flex; flex-direction:column;
  box-shadow:var(--card-shadow);
}
.panel-grid{ display:grid; gap:12px; flex:1; min-height:0; }
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:9px; gap:12px;
}
.panel-title{
  font-family:'Montserrat',sans-serif; font-weight:700; font-size:13px;
  color:var(--navy); letter-spacing:.01em; white-space:nowrap;
}
.panel-legend{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.lg{ display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted); font-weight:600; }
.lg-sw{ width:10px; height:10px; border-radius:2px; flex:none; }
.panel-body{ flex:1; min-height:0; position:relative; overflow:hidden; }

/* ---- Slicers ------------------------------------------------------- */
.slicers{ display:flex; gap:8px; align-items:flex-end; }
.slicer{ display:flex; flex-direction:column; gap:2px; }
.slicer-lbl{
  font-size:8.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); padding-left:2px;
}
.slicer-box{
  display:flex; align-items:center; gap:7px; background:#fff;
  border:1px solid var(--card-border); border-radius:6px;
  padding:6px 10px; font-size:11.5px; font-weight:600;
  color:var(--ink); min-width:126px; cursor:pointer;
  transition:border-color .1s;
}
.slicer-box:hover{ border-color:var(--blue); }
.slicer-box .chev{ margin-left:auto; color:var(--muted); font-size:8px; }
.slicer-box.active{ border-color:var(--blue); }

/* ---- Tables -------------------------------------------------------- */
.tbl{ width:100%; border-collapse:collapse; font-size:11.5px; }
.tbl thead th{
  text-align:left; font-family:'Montserrat',sans-serif; font-weight:700;
  font-size:9.5px; letter-spacing:.07em; text-transform:uppercase;
  color:#fff; background:var(--navy); padding:7px 11px;
}
.tbl thead th:first-child{ border-radius:5px 0 0 0; }
.tbl thead th:last-child{ border-radius:0 5px 0 0; }
.tbl thead th.num{ text-align:right; }
.tbl tbody td{
  padding:8px 11px; border-bottom:1px solid #EEF2F6;
  color:var(--ink); font-weight:500;
}
.tbl tbody td.num{ text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
.tbl tbody tr:nth-child(even){ background:#F8FAFB; }
.tbl tbody tr.click{ cursor:pointer; }
.tbl tbody tr.click:hover{ background:rgba(21,116,196,.07); }

/* status pill */
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px;
  border-radius:999px; font-size:10px; font-weight:700; letter-spacing:.02em;
}
.dot{ width:6px; height:6px; border-radius:50%; flex:none; }

/* inline bar in table cell */
.cellbar{
  position:relative; height:16px; border-radius:3px;
  background:#EEF2F6; overflow:hidden;
}
.cellbar > span{ position:absolute; inset:0 auto 0 0; border-radius:3px; }
.cellbar > i{
  position:absolute; inset:0; display:flex; align-items:center;
  justify-content:flex-end; padding-right:6px;
  font-size:10px; font-weight:700; font-style:normal; color:var(--ink);
}

/* progress bar (job detail) */
.prog-wrap{ display:flex; flex-direction:column; gap:3px; }
.prog-label{ font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
.prog-track{ height:7px; background:#EEF2F6; border-radius:999px; overflow:hidden; }
.prog-fill{ height:100%; border-radius:999px; transition:width .3s; }

/* ---- SVG chart helpers -------------------------------------------- */
.axis-lbl{ font-family:'Aptos','Segoe UI',sans-serif; font-size:10px; fill:#8A97A4; }
.bar-val{ font-family:'Montserrat',sans-serif; font-size:10.5px; font-weight:700; fill:var(--ink); }
.bar-name{ font-family:'Aptos','Segoe UI',sans-serif; font-size:11px; fill:var(--ink); font-weight:500; }
.grid-line{ stroke:#EAF0F5; stroke-width:1; }

/* ---- Tooltip ------------------------------------------------------- */
.tt{
  position:absolute; pointer-events:none;
  background:var(--navy); color:#fff;
  padding:7px 11px; border-radius:7px;
  font-size:11px; font-weight:600;
  transform:translate(-50%,-115%); white-space:nowrap;
  z-index:20; opacity:0; transition:opacity .1s;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.08);
}
.tt b{ font-family:'Montserrat',sans-serif; }
.tt.show{ opacity:1; }

/* ---- Drill hint ---------------------------------------------------- */
.drillhint{
  font-size:10px; color:var(--blue); font-weight:700;
  display:flex; align-items:center; gap:4px; white-space:nowrap;
}

/* ---- Job detail sub-header ---------------------------------------- */
.subhdr{
  background:var(--navy); border-radius:var(--radius);
  padding:13px 18px;
  display:flex; align-items:center; gap:0; color:#fff;
}
.subhdr .jb-name{
  font-family:'Montserrat',sans-serif; font-weight:800; font-size:18px;
  white-space:nowrap; flex:none; letter-spacing:.01em;
}
.subhdr .jb-divider{ width:1px; background:rgba(255,255,255,.12); align-self:stretch; margin:0 20px; }
.subhdr .jb-meta{ display:flex; gap:24px; }
.subhdr .jb-field{ display:flex; flex-direction:column; gap:2px; }
.subhdr .jb-k{ font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#4A6680; font-weight:700; }
.subhdr .jb-v{ font-size:12.5px; font-weight:700; }
.backbtn{
  display:inline-flex; align-items:center; gap:5px; cursor:pointer;
  color:var(--blue); font-weight:700; font-size:11.5px;
  background:#fff; border:1px solid var(--card-border);
  border-radius:6px; padding:6px 11px; margin-left:auto;
  transition:background .1s;
}
.backbtn:hover{ background:var(--paper); }

/* ---- Billing group mini bars (exec hero aside) -------------------- */
.bgroup-list{ display:flex; flex-direction:column; gap:8px; min-width:200px; }
.bgroup-row{ display:flex; flex-direction:column; gap:3px; }
.bgroup-labels{ display:flex; justify-content:space-between; align-items:baseline; }
.bgroup-name{ font-size:10px; font-weight:700; color:var(--ink); text-transform:uppercase; letter-spacing:.05em; }
.bgroup-nums{ font-size:10px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
.bgroup-track{ height:8px; background:#EEF2F6; border-radius:999px; overflow:hidden; position:relative; }
.bgroup-actual{ position:absolute; top:0; left:0; bottom:0; border-radius:999px; }
.bgroup-quoted{ position:absolute; top:0; left:0; bottom:0; border-radius:999px; opacity:.35; }

/* ---- Density tweaks ----------------------------------------------- */
#canvas[data-density="compact"] .content{ gap:9px; padding:13px 20px 14px; }
#canvas[data-density="compact"] .hero{ padding:13px 20px; }
#canvas[data-density="compact"] .hero-num{ font-size:calc(var(--hero-fs) * .82); }
#canvas[data-density="compact"] .kpis{ gap:9px; }
#canvas[data-density="compact"] .kpi{ padding:10px 13px; }
#canvas[data-density="compact"] .kpi-val{ font-size:26px; }
#canvas[data-density="compact"] .panel{ padding:10px 14px 9px; }

/* ---- Hide toggles -------------------------------------------------- */
#canvas.hide-q .qstrip{ display:none; }
#canvas.hide-drill .drillhint{ display:none; }

</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

});

const { useState, useRef } = React;
const C = window.SDC.C;

const fmt  = (n) => n.toLocaleString('en-US');
const fmtK = (n) => Math.abs(n) >= 1000 ? (n < 0 ? '-' : '') + (Math.abs(n)/1000).toFixed(1)+'K' : ''+n;
const usd  = (n) => (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US');
const usdK = (n) => {
  const a=Math.abs(n), sign=n<0?'-':'';
  if(a>=1e6) return sign+'$'+(a/1e6).toFixed(2)+'M';
  if(a>=1e3) return sign+'$'+Math.round(a/1e3)+'K';
  return sign+'$'+a;
};

/* ---- Tooltip hook ---- */
function useTip(){
  const [tip,setTip] = useState(null);
  const node = tip ? <div className="tt show" style={{left:tip.x, top:tip.y}}
      dangerouslySetInnerHTML={{__html:tip.html}} /> : null;
  return [node, setTip];
}

/* ---- Horizontal Bar Chart -----------------------------------------
   Improvements: target line, better label truncation, hover state,
   value labels always outside bar, cleaner track bg               */
function HBar({ data, colorFor, valueFmt=fmt, onPick, max, showTarget }){
  const [tip,setTip] = useTip();
  const [hov,setHov] = useState(null);
  const W=640, rowH=Math.min(32, 270/data.length), gap=7;
  const labelW=192, valW=68, plotW=W-labelW-valW;
  const top=4;
  const mx = max || Math.max(...data.map(d=>Math.abs(d.value)));
  const H = top + data.length*(rowH+gap);
  const hasNeg = data.some(d=>d.value<0);
  const zero = hasNeg ? labelW + plotW*0.45 : labelW;
  const scale = hasNeg ? (plotW*0.45)/mx : plotW/mx;

  return (
    <div style={{position:'relative',width:'100%',height:'100%'}}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
        {/* subtle grid lines */}
        {[0.25,0.5,0.75,1].map((f,i)=>{
          const gx = hasNeg ? zero + (plotW*0.45)*f : labelW + plotW*f;
          return <line key={i} className="grid-line" x1={gx} y1={0} x2={gx} y2={H} strokeDasharray="3 3"/>;
        })}
        {data.map((d,i)=>{
          const y=top+i*(rowH+gap);
          const w=Math.abs(d.value)*scale;
          const x=d.value<0 ? zero-w : zero;
          const col=colorFor(d);
          const isHov = hov===i;
          const label = d.label.length>28 ? d.label.slice(0,27)+'…' : d.label;
          return (
            <g key={i}
               style={{cursor:onPick?'pointer':'default'}}
               onClick={()=>onPick&&onPick(d.id)}
               onMouseEnter={()=>setHov(i)}
               onMouseLeave={()=>{ setHov(null); setTip(null); }}
               onMouseMove={(e)=>{
                 const r=e.currentTarget.ownerSVGElement.parentNode.getBoundingClientRect();
                 setTip({x:e.clientX-r.left, y:e.clientY-r.top,
                   html:`<b>${d.label}</b><br/>${valueFmt(d.value)}`});
               }}>
              {/* hover bg */}
              {isHov && <rect x={0} y={y-2} width={W} height={rowH+4} fill="rgba(21,116,196,.05)" rx="3"/>}
              {/* label */}
              <text className="bar-name" x={labelW-10} y={y+rowH/2+4} textAnchor="end"
                style={{fontSize:11, fontWeight: isHov?700:500}}>{label}</text>
              {/* track */}
              <rect x={labelW} y={y+2} width={plotW} height={rowH-4} fill="#EEF2F6" rx="3"/>
              {/* bar */}
              <rect x={x} y={y+2} width={Math.max(w,3)} height={rowH-4} fill={col} rx="3"
                opacity={isHov ? 1 : 0.9}/>
              {/* value label */}
              <text className="bar-val" x={d.value<0 ? x-5 : x+Math.max(w,3)+5}
                    y={y+rowH/2+4}
                    textAnchor={d.value<0?'end':'start'}
                    style={{fontSize:10.5}}>{valueFmt(d.value)}</text>
            </g>
          );
        })}
        {hasNeg && <line x1={zero} y1={0} x2={zero} y2={H} stroke="#B0BEC8" strokeWidth="1.5"/>}
      </svg>
      {tip}
    </div>
  );
}

/* ---- Line Trend Chart ---------------------------------------------
   Improvements: area fill under actual line, better axis labels,
   dot hover with larger hit area, cleaner grid               */
function LineTrend({ data, keys }){
  const [tip,setTip] = useTip();
  const W=880,H=290, padL=48,padR=18,padT=16,padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const all=data.flatMap(d=>keys.map(k=>d[k.k]));
  const rawMax=Math.max(...all);
  const max=Math.ceil(rawMax/5000)*5000; const min=0;
  const x=(i)=>padL+(data.length===1?plotW/2:i*(plotW/(data.length-1)));
  const y=(v)=>padT+plotH-(v-min)/(max-min)*plotH;
  const ticks=5;

  return (
    <div style={{position:'relative',width:'100%',height:'100%'}}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
        {/* grid */}
        {Array.from({length:ticks+1}).map((_,i)=>{
          const v=max/ticks*i; const yy=y(v);
          return <g key={i}>
            <line className="grid-line" x1={padL} y1={yy} x2={W-padR} y2={yy}/>
            <text className="axis-lbl" x={padL-8} y={yy+3.5} textAnchor="end">{fmtK(v)}</text>
          </g>;
        })}
        {/* month labels */}
        {data.map((d,i)=>(
          <text key={i} className="axis-lbl" x={x(i)} y={H-8} textAnchor="middle">{d.m}</text>
        ))}
        {/* area fill for first key (actual) */}
        {keys.slice(0,1).map((k,ki)=>{
          const areaPath = data.map((d,i)=>`${i===0?'M':'L'}${x(i)},${y(d[k.k])}`).join(' ')
            + ` L${x(data.length-1)},${padT+plotH} L${padL},${padT+plotH} Z`;
          return <path key={'area-'+ki} d={areaPath} fill={k.color} opacity=".06"/>;
        })}
        {/* lines */}
        {keys.map((k,ki)=>{
          const path=data.map((d,i)=>`${i?'L':'M'}${x(i)},${y(d[k.k])}`).join(' ');
          return <path key={ki} d={path} fill="none" stroke={k.color}
            strokeWidth={ki===0?2.5:2} strokeDasharray={k.dash||'0'}
            strokeLinejoin="round" strokeLinecap="round"/>;
        })}
        {/* dots with hover */}
        {keys.map((k,ki)=>data.map((d,i)=>(
          <g key={ki+'-'+i}>
            <circle cx={x(i)} cy={y(d[k.k])} r="8" fill="transparent"
              onMouseMove={(e)=>{const r=e.currentTarget.ownerSVGElement.parentNode.getBoundingClientRect();
                setTip({x:e.clientX-r.left,y:e.clientY-r.top,
                  html:`${d.m} · <b>${k.label}</b><br/>${fmt(d[k.k])} hrs`});}}
              onMouseLeave={()=>setTip(null)} style={{cursor:'pointer'}}/>
            <circle cx={x(i)} cy={y(d[k.k])} r="3.5" fill="#fff"
              stroke={k.color} strokeWidth="2" style={{pointerEvents:'none'}}/>
          </g>
        )))}
      </svg>
      {tip}
    </div>
  );
}

/* ---- Donut Chart -------------------------------------------------- */
function Donut({ segments, center }){
  const [tip,setTip]=useTip();
  const R=76, r=48, cx=88, cy=88;
  const total=segments.reduce((s,x)=>s+x.value,0);
  let a=-Math.PI/2;
  const arc=(start,end)=>{
    const x1=cx+R*Math.cos(start),y1=cy+R*Math.sin(start);
    const x2=cx+R*Math.cos(end),y2=cy+R*Math.sin(end);
    const xi2=cx+r*Math.cos(end),yi2=cy+r*Math.sin(end);
    const xi1=cx+r*Math.cos(start),yi1=cy+r*Math.sin(start);
    const big=end-start>Math.PI?1:0;
    return `M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${xi2},${yi2} A${r},${r} 0 ${big} 0 ${xi1},${yi1} Z`;
  };
  return (
    <div style={{position:'relative',display:'flex',alignItems:'center',gap:16,height:'100%'}}>
      <svg viewBox="0 0 176 176" width="152" height="152" style={{flex:'none'}}>
        {segments.map((s,i)=>{
          const ang=s.value/total*Math.PI*2; const st=a; a+=ang;
          return <path key={i} d={arc(st,a)} fill={s.color}
            onMouseMove={(e)=>{const rr=e.currentTarget.ownerSVGElement.parentNode.getBoundingClientRect();
              setTip({x:e.clientX-rr.left,y:e.clientY-rr.top,
                html:`<b>${s.label}</b><br/>${s.value} jobs · ${Math.round(s.value/total*100)}%`});}}
            onMouseLeave={()=>setTip(null)} style={{cursor:'pointer'}}/>;
        })}
        <text x="88" y="82" textAnchor="middle" fontFamily="Montserrat,sans-serif"
          fontSize="28" fontWeight="800" fill={C.navy}>{center.top}</text>
        <text x="88" y="100" textAnchor="middle" fontSize="10.5" fill="#6B7682" fontWeight="600">
          {center.bot}</text>
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {segments.map((s,i)=>(
          <div key={i} className="lg" style={{fontSize:11.5}}>
            <span className="lg-sw" style={{background:s.color}}></span>
            <span style={{color:C.ink,fontWeight:700,minWidth:72}}>{s.label}</span>
            <span style={{color:'#6B7682'}}>{s.value} · {Math.round(s.value/total*100)}%</span>
          </div>
        ))}
      </div>
      {tip}
    </div>
  );
}

            </div>

}

function QStrip({ q }){
  return (
    <div className="qstrip">
      <span className="q-eyebrow">This page answers</span>
      <span className="q-divider">·</span>
      <span className="q-text">"{q}"</span>
    </div>
  );
}

/* KPI card — top accent bar, optional trend, optional tone */
function Kpi({ label, value, foot, accent, tone }){
  return (
    <div className={'kpi'+(tone?' '+tone:'')}>
      {accent && <div className="kpi-accent" style={{background:accent}}></div>}
      <div className="kpi-label">{label}</div>
      <div className="kpi-val">{value}</div>
      {foot && <div className="kpi-foot">{foot}</div>}
    </div>
  );
}

/* Hero — big number + optional delta pill + optional right-side aside */
function Hero({ label, value, sub, delta, aside }){
  return (
    <div className="hero">
      <div className="hero-main">
        <div className="hero-label">{label}</div>
        <div style={{display:'flex',alignItems:'flex-end',gap:16}}>
          <div className="hero-num">{value}</div>
          {delta}
        </div>
        {sub && <div className="hero-sub">{sub}</div>}
      </div>
      {aside && (
        <>
          <div className="hero-divider"/>
          <div className="hero-aside">{aside}</div>
        </>
      )}
    </div>
  );
}

function Delta({ pct, dir, kind }){
  const arrow = dir==='up' ? '▲' : '▼';
  return <span className={'delta '+kind}><span className="delta-arrow">{arrow}</span>{pct}</span>;
}

function Panel({ title, legend, children, style }){
  return (
    <div className="panel" style={style}>
      <div className="panel-head">
        <div className="panel-title">{title}</div>
        {legend && <div className="panel-legend">{legend}</div>}
      </div>
      <div className="panel-body">{children}</div>
    </div>
  );
}

const Lg = ({c,t}) => (
  <span className="lg">
    <span className="lg-sw" style={{background:c}}></span>{t}
  </span>
);

/* Status pill — improved contrast */
function StatusPill({ status }){
  const cfg = {
    'On Track': { bg:'rgba(116,196,21,.12)',  dot:SC.green,  text:'#2d5c06' },
    'At Risk':  { bg:'rgba(255,222,81,.18)',  dot:'#d4a017', text:'#7a5200' },
    'Overrun':  { bg:'rgba(255,222,81,.22)',  dot:'#d4a017', text:'#7a5200' },
    'Complete': { bg:'rgba(107,118,130,.12)', dot:SC.gray,   text:'#4a5260' },
  };
  const s = cfg[status] || cfg['Complete'];
  return (
    <span className="pill" style={{background:s.bg, color:s.text}}>
      <span className="dot" style={{background:s.dot}}></span>
      {status}
    </span>
  );
}

/* Group tag — Engineering / Shop / Manufacturing */
function GroupTag({ group }){
  const cls = group==='Engineering' ? 'eng' : group==='Shop' ? 'shop' : 'mfg';
  return <span className={'group-tag '+cls}>{group}</span>;
}

/* Progress bar — shows actual vs quoted */
function ProgressBar({ actual, quoted, label }){
  const pct = quoted > 0 ? Math.min((actual/quoted)*100, 120) : 0;
  const over = actual > quoted;
  return (
    <div className="prog-wrap">
      {label && <div className="prog-label">{label}</div>}
      <div className="prog-track">
        <div className="prog-fill" style={{
          width: pct+'%',
          background: over ? SC.yellow : SC.blue,
          maxWidth:'100%',
        }}></div>
      </div>
    </div>
  );
}

/* Slicer (visual only) */
function Slicer({ label, value, active, onClick }){
  return (
    <div className="slicer">
      <div className="slicer-lbl">{label}</div>
      <div className={'slicer-box'+(active?' active':'')} onClick={onClick}>
        <span>{value}</span><span className="chev">▼</span>
      </div>
    </div>
  );
}

Object.assign(window, {
  Rail, Header, QStrip, Kpi, Hero, Delta, Panel, Lg,
  StatusPill, GroupTag, ProgressBar, Slicer, NAV
});

/* ============================================================
   SDC — REVAMP pages
   Same data, same calculations as original.
   Improvements per page:
   Exec:   billing group breakdown in hero aside, donut chart
   Hours:  variance summary in hero, progress bars in table
   Util:   group tags, better breakdown layout
   Profit: diverging bars, cleaner zero-line treatment
   Parts:  quoted vs invoiced comparison bars
   Detail: progress bars, better two-row kpi layout
   ============================================================ */
const D = window.SDC;
const PC = D.C;

/* tone helpers — identical logic to original */
const hoursTone = (j)=> j.status==='Overrun' ? PC.yellow : PC.blue;
const plTone    = (d)=> d.value>=0 ? PC.green : PC.yellow;
const utilTone  = (d)=> d.value>=80 ? PC.green : d.value>=60 ? PC.yellow : PC.gray;

/* ============ PAGE 1 · EXECUTIVE SUMMARY ======================== */
function PageExec({ go, pick }){
  const variance = D.totalActual - D.totalQuoted;
  const pct = ((variance/D.totalQuoted)*100).toFixed(1);
  const totalPortfolio = D.statusTable.reduce((s,r)=>s+r.count,0);

  const donutSegs = [
    { label:'On Track', value:42, color:PC.green  },
    { label:'At Risk',  value:9,  color:PC.yellow },
    { label:'Overrun',  value:6,  color:'#E8B800' },
    { label:'Complete', value:18, color:PC.gray   },
  ];

  return (
    <div className="content">
      <QStrip q="How is SDC performing right now?" />
      <Hero
        label="Actual Hours vs Quoted — Project to Date"
        value={fmt(D.totalActual)}
        delta={<Delta pct={`+${pct}%`} dir="up" kind="over" />}
        sub={<>vs <b>{fmt(D.totalQuoted)}</b> quoted · <b>+{fmt(variance)}</b> hrs over plan</>}
        aside={<BillingGroupAside groups={D.billingGroups}/>}
      />
      <div className="kpis c4">
        <Kpi label="Active Jobs"  value="57"  accent={PC.blue}   foot="In progress now" />
        <Kpi label="At-Risk Jobs" value="9"   accent={PC.yellow} tone="warn" foot="Trending over quote" />
        <Kpi label="Employees"    value="31"  accent={PC.navy}   foot="Eng · Mfg · Shop" />
        <Kpi label="Utilization"  value="89%" accent={PC.green}  tone="good" foot="Company-wide" />
      </div>
      <div className="panel-grid" style={{gridTemplateColumns:'1.7fr 1fr'}}>
        <Panel title="Monthly Hours — Actual vs Quoted (12 mo)"
          legend={<><Lg c={PC.blue} t="Actual"/><Lg c={PC.navy} t="Quoted"/></>}>
          <LineTrend data={D.monthlyTrend}
            keys={[{k:'actual',color:PC.blue,label:'Actual'},{k:'quoted',color:PC.navy,label:'Quoted',dash:'6 4'}]}/>
        </Panel>
        <Panel title="Portfolio Status">
          <Donut
            segments={donutSegs}
            center={{top: totalPortfolio, bot:'total jobs'}}
          />
        </Panel>
      </div>
    </div>
  );
}

/* ============ PAGE 2 · JOB HOURS ================================ */
function PageHours({ go, pick }){
  const top = [...D.jobs].sort((a,b)=>b.hoursActual-a.hoursActual).slice(0,10)
    .map(j=>({ label:`${j.id} · ${j.name}`, value:j.hoursActual, id:j.id, status:j.status }));

  return (
    <div className="content">

/* ============ PAGE 3 · EMPLOYEE UTILIZATION ===================== */

  const groupAvg = (grp) => {

  return (
    <div className="content">
      <QStrip q="Are our people utilized well?" />

        label="Company Utilization"

        delta={<span className="delta good"><span className="delta-arrow">▲</span>on target</span>}

          <div style={{display:'flex',gap:20,alignItems:'center'}}>

            ].map(([g,v,c])=>(
              <div key={g} style={{textAlign:'center'}}>
                <div className="mont" style={{fontSize:28,fontWeight:800,color:PC.navy,lineHeight:1}}>{v}%</div>

/* ============ PAGE 6 · JOB DETAIL (drill-through) =============== */
function PageDetail({ go, jobId, setJob }){
  const job = D.jobs.find(j=>j.id===jobId) || D.jobs[0];
  const [open,setOpen] = React.useState(false);
  const variance = job.hoursActual - job.hoursQuoted;
  const varPct = job.hoursQuoted ? ((variance/job.hoursQuoted)*100).toFixed(1) : '—';
  const profPct = job.status==='Complete'
    ? Math.round(job.pl/(job.hoursActual*120+job.parts)*100)
    : null;
  const months = D.jobMonthly(job);
  const emps   = D.jobEmployees(job);

  const statusCfg = {
    'Overrun': PC.yellow, 'At Risk': '#E8B800',
    'On Track': PC.green, 'Complete': PC.gray,
  };

  return (
    <div className="content">
      {/* top bar: question + job selector + back */}
      <div className="qstrip" style={{justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span className="q-eyebrow">This page answers</span>
          <span className="q-divider">·</span>
          <span className="q-text">"Everything about this one job"</span>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <div style={{position:'relative'}}>
            <div className="slicer-box active" style={{minWidth:248,maxWidth:248}}
              onClick={()=>setOpen(o=>!o)}>
              <span style={{fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',
                textOverflow:'ellipsis'}}>{job.id} · {job.name}</span>
              <span className="chev">▼</span>
            </div>
            {open && (
              <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,
                zIndex:30,background:'#fff',border:'1px solid var(--card-border)',
                borderRadius:8,boxShadow:'0 12px 30px rgba(6,29,57,.18)',
                maxHeight:280,overflowY:'auto'}}>
                {D.jobs.map(j=>(
                  <div key={j.id} onClick={()=>{setJob(j.id); setOpen(false);}}
                    style={{padding:'8px 11px',fontSize:11.5,
                      fontWeight:j.id===job.id?700:500,
                      cursor:'pointer',
                      background:j.id===job.id?'rgba(21,116,196,.08)':'#fff',
                      color:'var(--ink)',
                      borderBottom:'1px solid #F0F3F6'}}
                    onMouseEnter={e=>e.currentTarget.style.background='rgba(21,116,196,.05)'}
                    onMouseLeave={e=>e.currentTarget.style.background=j.id===job.id?'rgba(21,116,196,.08)':'#fff'}>
                    <span style={{color:'#9AAFC4',marginRight:6}}>{j.id}</span>{j.name}
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="backbtn" onClick={()=>go('hours')}>← Back</div>
        </div>
      </div>

      {/* job sub-header */}
      <div className="subhdr">
        <div>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:'.12em',
            textTransform:'uppercase',color:'#4A6680',marginBottom:3}}>Job</div>
          <div className="jb-name">{job.id} · {job.name}</div>
        </div>
        <div className="jb-divider"/>
        <div className="jb-meta">
          <div className="jb-field">
            <div className="jb-k">Customer</div>
            <div className="jb-v">{job.customer}</div>
          </div>
          <div className="jb-field">
            <div className="jb-k">Status</div>
            <div className="jb-v" style={{color:statusCfg[job.status]||'#fff'}}>{job.status}</div>
          </div>
          <div className="jb-field">
            <div className="jb-k">Type</div>
            <div className="jb-v">{job.type}</div>
          </div>
          <div className="jb-field">
            <div className="jb-k">Hours Progress</div>
            <div className="jb-v" style={{paddingTop:2}}>
              <ProgressBar actual={job.hoursActual} quoted={job.hoursQuoted} />
            </div>
          </div>
        </div>
      </div>

      {/* KPI row 1 — hours */}
      <div className="kpis c4">
        <Kpi label="Actual Hours"   value={fmt(job.hoursActual)}  accent={PC.blue} />
        <Kpi label="Quoted Hours"   value={job.hoursQuoted?fmt(job.hoursQuoted):'—'} accent={PC.navy} />
        <Kpi label="ETC Hours"      value={fmt(job.etc)} accent={PC.light} foot="Est. to complete" />
        <Kpi label="Hours Variance"
          value={(variance>0?'+':'')+fmt(variance)}
          accent={variance>0?PC.yellow:PC.green}
          tone={variance>0?'warn':'good'}
          foot={varPct==='—'?'no quote':`${variance>0?'+':''}${varPct}% vs quote`} />
      </div>

      {/* KPI row 2 — financials */}
      <div className="kpis c4">
        <Kpi label="Parts Invoiced" value={usd(job.parts)}  accent={PC.blue} />
        <Kpi label="Parts Quoted"   value={job.partsQuoted?usd(job.partsQuoted):'—'} accent={PC.navy} />
        <Kpi label="Profit / Loss"  value={usdK(job.pl)}
          accent={job.pl>=0?PC.green:PC.yellow}
          tone={job.pl>=0?'good':'warn'} />
        <Kpi label="Profitability %"
          value={profPct !== null ? profPct+'%' : '—'}
          accent={PC.gray}
          foot={profPct !== null ? 'fully booked' : 'completed jobs only'} />
      </div>

      {/* bottom panels */}
      <div className="panel-grid" style={{gridTemplateColumns:'1.55fr 1fr'}}>
        <Panel title="Monthly Hours — This Job"
          legend={<><Lg c={PC.blue} t="Actual"/><Lg c={PC.navy} t="Quoted"/></>}>
          <LineTrend data={months}
            keys={[{k:'actual',color:PC.blue,label:'Actual'},{k:'quoted',color:PC.navy,label:'Quoted',dash:'6 4'}]}/>
        </Panel>
        <Panel title="Employee Hours on This Job">
          <table className="tbl">
            <thead>
              <tr><th>Employee</th><th>Dept</th><th className="num">Hours</th></tr>
            </thead>
            <tbody>
              {emps.map(e=>(
                <tr key={e.name}>
                  <td style={{fontWeight:600}}>{e.name}</td>
                  <td><GroupTag group={e.dept}/></td>
                  <td className="num">{fmt(e.hours)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Panel>
      </div>
    </div>
  );
}

Object.assign(window, { PageExec, PageHours, PageUtil, PageProfit, PageParts, PageDetail });

/* ============================================================
   SDC Job Hours Report — REVAMP app shell
   Same routing, same drill-through logic as original.
   ============================================================ */
const { useState: uS, useEffect: uE } = React;

const TITLES = {
  exec:   ['Executive Summary',     'Company hours, jobs & people'],
  hours:  ['Job Hours',             'Actual hours by job'],
  util:   ['Employee Utilization',  'Workforce utilization & billable mix'],
  profit: ['Profitability',         'Job-level profit & loss'],
  parts:  ['Parts & Costs',         'Invoiced parts spend by job'],
  detail: ['Job Detail',            'Single-job deep dive'],
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfortable",
  "heroScale": 1,
  "showQuestion": true,
  "showDrillHints": true
}/*EDITMODE-END*/;

function App(){
  const [tw,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page,setPage] = uS(()=>(localStorage.getItem('sdc_page')||'exec'));
  const [jobId,setJobId] = uS(()=>(localStorage.getItem('sdc_job')||'1118'));

  uE(()=>{ localStorage.setItem('sdc_page',page); },[page]);
  uE(()=>{ localStorage.setItem('sdc_job',jobId); },[jobId]);

  uE(()=>{
    const c=document.getElementById('canvas');
    c.setAttribute('data-density', tw.density);
    c.style.setProperty('--hero-fs', (72*tw.heroScale)+'px');
    c.classList.toggle('hide-q', !tw.showQuestion);
    c.classList.toggle('hide-drill', !tw.showDrillHints);
  },[tw.density,tw.heroScale,tw.showQuestion,tw.showDrillHints]);

  const go   = (p)=>setPage(p);
  const pick = (id)=>{ setJobId(id); setPage('detail'); };

  const [title,sub] = TITLES[page];
  const headerSub = page==='detail'
    ? 'Drill-through · single-job analysis'
    : `${sub} · Refreshed thru ${window.SDC.meta.refreshedThru}`;

  let body;
  if      (page==='exec')   body=<PageExec   go={go} pick={pick}/>;
  else if (page==='hours')  body=<PageHours  go={go} pick={pick}/>;
  else if (page==='util')   body=<PageUtil   go={go} pick={pick}/>;
  else if (page==='profit') body=<PageProfit go={go} pick={pick}/>;
  else if (page==='parts')  body=<PageParts  go={go} pick={pick}/>;
  else                      body=<PageDetail go={go} jobId={jobId} setJob={setJobId}/>;

  return (
    <div className="shell">
      <Rail page={page} go={go}/>
      <Header title={title} sub={headerSub}/>
      {body}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={tw.density}
          options={['comfortable','compact']}
          onChange={(v)=>setTweak('density',v)} />
        <TweakSlider label="Hero number" value={tw.heroScale} min={0.8} max={1.2} step={0.05}
          onChange={(v)=>setTweak('heroScale',v)} />
        <TweakSection label="Show / hide" />
        <TweakToggle label='"This page answers" strip' value={tw.showQuestion}
          onChange={(v)=>setTweak('showQuestion',v)} />
        <TweakToggle label="Drill-through hints" value={tw.showDrillHints}
          onChange={(v)=>setTweak('showDrillHints',v)} />
      </TweaksPanel>
    </div>
  );
}

/* ---- Stage scaler ---- */
function fit(){
  const c=document.getElementById('canvas');
  const s=Math.min(window.innerWidth/1280, window.innerHeight/720);
  c.style.transform='translate(-50%,-50%) scale('+s+')';
}
window.addEventListener('resize', fit);
ReactDOM.createRoot(document.getElementById('canvas')).render(<App/>);
fit();

  </script>
