appId: com.sdc.tools
productName: SDC Tools
copyright: Copyright © 2025 SDC

# Pin the electron binary version explicitly.
# electron-builder normally auto-detects this from shell/node_modules/electron,
# but because 'shell' is an npm workspace member all deps are hoisted to the
# root node_modules — so the local lookup always fails.  Setting electronVersion
# here bypasses that lookup entirely; electron-builder downloads the correct
# binary directly from GitHub releases.
electronVersion: "35.7.5"

directories:
  buildResources: build
  output: dist-electron

# Publish target — GitHub Releases.
# electron-updater reads latest.yml from the release assets and auto-updates.
# ⚠ Set SKIP_AUTO_UPDATE=1 in the launch env to disable updater (dev / no-internet).
publish:
  provider: github
  owner: steven-douglas-corporation
  repo: SDC-Tools
  releaseType: release    # publish immediately — not a draft

# Shell app files only — launcher UI + Electron main process.
# Backends run on the company server PC (PM2), not bundled here.
# This keeps the installer lean (~100 MB vs ~600 MB previously).
files:
  - electron/**
  - dist/**
  - build/icons/**
  - package.json
  - .env

win:
  sign: null
  signingHashAlgorithms: null
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: "SDC-Tools-Setup-${version}.exe"

# No native modules in the shell — asar is safe to keep enabled.
# (better-sqlite3 and other native deps live on the server, not here)
asar: true
