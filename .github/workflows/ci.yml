name: CI — All Apps

# One job per app, each running the same three commands the app defines:
# `npm run lint`, `npm test`, and `npm run build` where the app has a build.
# A job fails the PR on lint ERRORS and test failures; lint warnings are shown
# in the log and do not block (see docs/adr/0005-lint-config-copied-per-app.md).
#
# Every app job runs on every push and PR. Path filtering was tried and
# removed: a job that is skipped is not a "passed" required status check, so
# branch protection would block PRs that touched only one app.

on:
  push:
    branches: [master, main, develop, "feat/**", "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint-configs:
    name: Lint configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Every app's eslint.config.mjs matches packages/eslint-config
        run: node scripts/check-lint-configs.mjs

  assemblies:
    name: Assemblies Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assemblies
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/assemblies/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production

  build-readiness:
    name: Build Readiness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/build-readiness
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/build-readiness/package-lock.json
            apps/build-readiness/client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm run lint
      - run: npm test
      - run: npm run build

  calendar:
    name: Calendar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/calendar
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/calendar/package-lock.json
            apps/calendar/server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - name: Server loads
        run: node --check server/server.js

  state-logic:
    name: State Logic Builder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/state-logic
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/state-logic/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Server loads
        run: node --check server.js

  shell:
    name: Shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build renderer
        run: npm run build

  reports:
    name: Reports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reports
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/reports/package-lock.json
      # @azure/msal-node-extensions links against libsecret on Linux.
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-1-0
      - run: npm ci
      # Generated code, not committed; needs the schema only, not a database.
      - name: Prisma client
        run: npx prisma generate
      # Blocking since 2026-09-13: the two pre-existing set-state-in-effect errors
      # that kept this non-blocking were fixed with the Total ETO work.
      - run: npm run lint
      # node:test via tsx; no test imports Prisma, so no database is needed.
      - run: npm test
      # `next build` typechecks as it goes, and it has to come AFTER generate and
      # BEFORE any bare `tsc`: tsconfig includes the generated `.next/types`.
      # The failure tail is emitted as an annotation so "why is CI red" is
      # readable from the public API without an Actions login (2026-09-04).
      - name: Build (typechecks as it goes)
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          tail -c 4000 build.log
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 build.log | paste -sd'~' - | cut -c1-1400)
            echo "::error title=Reports build failed::${msg}"
          fi
          exit $code
        env:
          # The build reads these; neither needs to be real, it just must parse.
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
          AUTH_URL: http://localhost:3021
          AUTH_SECRET: ci-test-secret-do-not-use-in-production

  # ── One status for branch protection to require ────────────────────────────
  all-green:
    name: All checks passed
    needs: [lint-configs, assemblies, build-readiness, calendar, state-logic, shell, reports]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI jobs passed"
