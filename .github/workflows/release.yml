name: Build & Release SDC Tools

# ─────────────────────────────────────────────────────────────────────────────
# How to ship a new version:
#
#   1. Update SDC_SERVER_HOST in apps/shell/.env to the real server hostname/IP
#   2. Bump "version" in apps/shell/package.json  (e.g. "2.0.0" → "3.0.0")
#   3. git commit -m "chore: release v3.0"
#   4. git push origin master
#
# ── Versioning scheme (2026-08-24) ───────────────────────────────────────────
# Versions are NAMED two-part — 2.0, then 3.0 — but package.json must still
# hold a real three-part semver ("2.0.0"). That is not a style preference:
# electron-updater compares versions with semver, and semver rejects a two-part
# string outright — semver.valid("2.0") is null and semver.gt("2.0","1.8.1")
# THROWS. A bare "2.0" here would break the OTA update check on every installed
# desktop. The shell displays major.minor in its version chip (see
# formatVersion in apps/shell/src/App.jsx), so users see "v2.0" while the
# machinery keeps a version it can actually compare.
#
# A hotfix keeps the third number and SHOWS it: 2.0.1 displays as "2.0.1", so
# "which version are you on?" stays answerable.
#
# GitHub Actions builds the installer and publishes it to GitHub Releases.
# Every installed copy of SDC Tools auto-updates within ~30 minutes.
#
# Backend updates (new features, bug fixes) do NOT need a new installer:
#   → Just SSH into the server and run:  git pull && pm2 restart all
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]

# Required so electron-builder can create GitHub Releases
permissions:
  contents: write

jobs:
  # ── Step 1: Detect version bump (fast, runs on Linux) ──────────────────────
  check-version:
    name: Check if version changed
    runs-on: ubuntu-latest
    outputs:
      version:        ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: get_version
        run: echo "version=$(node -p "require('./apps/shell/package.json').version")" >> $GITHUB_OUTPUT

      - name: Compare with previous commit
        id: check
        run: |
          PREV=$(git show HEAD~1:apps/shell/package.json 2>/dev/null \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" \
            2>/dev/null || echo "none")
          CURR="${{ steps.get_version.outputs.version }}"
          echo "Previous: $PREV  →  Current: $CURR"
          if [ "$PREV" != "$CURR" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  # ── Step 2: Build & publish (only when version changed) ────────────────────
  build-and-release:
    name: Build installer & publish release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Write apps/shell/.env so the installer gets SDC_SERVER_HOST baked in.
      # Set SDC_SERVER_HOST in GitHub → Settings → Secrets → Actions.
      # Azure AD keys are only needed if MSAL auth is enabled.
      - name: Write apps/shell/.env
        shell: bash
        run: |
          cat > apps/shell/.env <<EOF
          SDC_SERVER_HOST=${{ secrets.SDC_SERVER_HOST || 'SERVER-APP1' }}
          AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          EOF

      # Shell is NOT in the workspace (removed so electron-builder finds electron locally)
      # Install shell deps locally so electron-builder can resolve the electron binary
      - name: Install shell deps
        working-directory: apps/shell
        run: npm install

      # Build the Vite launcher UI (React frontend for the shell window)
      - name: Build Vite launcher UI
        working-directory: apps/shell
        run: npm run build

      # Package and publish to GitHub Releases
      # Installer is now ~100 MB (shell only — backends run on server PC)
      - name: Package & publish installer to GitHub Releases
        working-directory: apps/shell
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep a 90-day backup copy in workflow artifacts
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v7
        with:
          name: SDC-Tools-v${{ needs.check-version.outputs.version }}
          path: apps/shell/dist-electron/*.exe
          retention-days: 90
