# Dependabot keeps dependencies current with one grouped pull request per
# package per week, so updates arrive as a reviewable batch rather than a
# flood. Security updates are opened as soon as an advisory lands.
#
# Each npm project in the monorepo is listed separately because each has its
# own lockfile and CI runs `npm ci` per app.
#
# Two groups per project — minor+patch, and majors — with a limit of two open
# PRs each. The first run (2026-09-13) opened 28 single-package PRs, most of
# them majors (React 19, Electron 44, Vite 8, ESLint 10) that each need a real
# migration; one grouped "majors" PR per app is a to-do list, 28 PRs is noise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    groups:
      actions: { patterns: ["*"] }

  # The root entry covers the npm WORKSPACE members too — apps/assemblies,
  # apps/build-readiness and apps/state-logic resolve through the root lockfile
  # (they have none of their own), so their updates must land in the root lock.
  # PR #37 (2026-09-13) came from a per-directory entry for build-readiness: it
  # rewrote a stale app-local lockfile, left the root lock out of sync, and every
  # workspace app's `npm ci` failed until it was reverted.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: ["minor", "patch"] }
      majors: { update-types: ["major"] }
    ignore:
      # The nested Scheduler repo is listed as a workspace but is not ours to update here.
      - dependency-name: "sdc-scheduler"



  - package-ecosystem: npm
    directory: /apps/build-readiness/client
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: ["minor", "patch"] }
      majors: { update-types: ["major"] }

  - package-ecosystem: npm
    directory: /apps/calendar
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: ["minor", "patch"] }
      majors: { update-types: ["major"] }

  - package-ecosystem: npm
    directory: /apps/calendar/server
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: ["minor", "patch"] }
      majors: { update-types: ["major"] }

  - package-ecosystem: npm
    directory: /apps/shell
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: ["minor", "patch"] }
      majors: { update-types: ["major"] }
    ignore:
      # Electron majors change the sandbox and updater contract; take them deliberately.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]


  - package-ecosystem: npm
    directory: /apps/reports
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: ["minor", "patch"] }
      majors: { update-types: ["major"] }
    ignore:
      # Next and Prisma majors are migrations, not updates.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16.2.9 does not run on ESLint 10 (merged 2026-09-13, reverted).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
